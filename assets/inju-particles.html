  #warn{ left:50%; transform:translateX(-50%); top:50%; max-width:640px; padding:22px 26px; text-align:center;

const GLITCH_I = 7, LAST_I = STAGES.length - 1;

const STAGE_START = (() => { const a = []; let t = 0; for (const s of STAGES) { a.push(t); t += s.dur; } return a; })();

/* ---------------------------------- 小工具 ---------------------------------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smoothstep = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
const fract = (x) => x - Math.floor(x);
const hashQ = (n) => fract(Math.sin(n * 12.9898) * 43758.5453);
function toast(msg, ms) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.style.opacity = '1';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.style.opacity = '0', ms || 2600);
}

/* ---------------------------------- gl 初始化 ---------------------------------- */
const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', {
  antialias: false, alpha: false, depth: false, stencil: false,
  premultipliedAlpha: false, preserveDrawingBuffer: true, powerPreference: 'high-performance',
});
if (!gl) {
  document.getElementById('warn').style.display = 'block';
  document.getElementById('warnBody').innerHTML = '当前浏览器不支持 <code>WebGL2</code>，请改用最新版 Chrome / Edge / Firefox。';
  return;
}

function sh(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s), src);
  return s;
}
function prog(vs, fs, name) {
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(name, gl.getProgramInfoLog(p));
  p._u = new Proxy({}, { get: (c, k) => (k in c ? c[k] : (c[k] = gl.getUniformLocation(p, k))) });
  return p;
}

/* ---------------------------------- 着色器 ---------------------------------- */

const PARTICLE_VS = `#version 300 es
precision highp float;
layout(location=0) in vec3 aScatter;
layout(location=1) in vec3 aShape;
layout(location=2) in vec3 aText;
layout(location=3) in vec3 aDir;
layout(location=4) in vec4 aSeed;
layout(location=5) in float aLum;
layout(location=6) in vec3 aMoon;
layout(location=7) in float aLumMoon;
layout(location=8) in float aDust;
uniform mat4 uProj, uView;
uniform float uTime, uProg, uStagger, uBurst, uJitter, uSize, uGhost, uCamDist, uShake, uLumMix;
uniform float uMoonMix, uDustAmp;
uniform vec3 uMoonCenter, uCamPos;
uniform int uA, uB, uEase;
out float vBright, vSeed, vGhost;

vec3 key(int i){
  if(i==0) return aScatter;
  if(i==1) return aShape;
  if(i==2) return aText;
  return aMoon;
}
float easeIn(float t){ return t*t*(3.0-2.0*t); }
float easeOut(float t){ return 1.0-pow(1.0-t,3.0); }
float easeQ(float t){ return t<0.5 ? 16.0*t*t*t*t*t : 1.0-pow(-2.0*t+2.0,5.0)*0.5; }

void main(){
  float s = uStagger;
  float t = clamp(uProg*(1.0+s) - s*aSeed.x, 0.0, 1.0);
  float e = uEase==1 ? easeOut(t) : uEase==2 ? easeQ(t) : easeIn(t);

  vec3 p = mix(key(uA), key(uB), e);

  float bulge = sin(3.14159265 * e);                 // 中途最猛
  p += aDir * uBurst * bulge;                        // 爆散冲量

  float ph = aSeed.w*71.0;
  float amp = uJitter * (0.22 + 0.78*bulge);
  p += vec3(sin(uTime*1.9+ph), cos(uTime*2.3+ph*1.7), sin(uTime*1.5+ph*2.3)) * amp;
  p += vec3(sin(uTime*0.8+ph), cos(uTime*1.05+ph*1.3), sin(uTime*0.6+ph*0.7)) * 0.014;
  p += vec3(sin(uTime*7.0+ph*3.0), cos(uTime*6.0+ph*2.0), 0.0) * 0.016 * uGhost;   // 虚影抖动

  /* 月尘：只在月球阶段生效，粒子随时间缓慢向外飘散 */
  if (aDust > 0.5) {
    float pd = aSeed.w * 91.0;
    p += vec3(sin(uTime*0.55+pd), cos(uTime*0.47+pd*1.3), sin(uTime*0.63+pd*0.8)) * uDustAmp * uMoonMix;
  }

  /* 月球：**轮廓优先** —— 只显示朝向相机的近半球（等价于把背面遮掉），
     轮廓由近半球的边缘形成，清晰、连续、闭合；背面不再叠加成雾。
     注意不要在这里做"边缘淡出"，那会把球体轮廓直接抹掉。 */
  float moonFade = 1.0;
  if (uMoonMix > 0.002) {
    vec3 nc = normalize(p - uMoonCenter);
    vec3 vd = normalize(uCamPos - p);
    moonFade = mix(1.0, smoothstep(-0.18, 0.02, dot(nc, vd)), uMoonMix);
  }

  vec4 mv = uView * vec4(p, 1.0);
  gl_Position = uProj * mv;
  float dist = max(0.5, -mv.z);
  /* 点彩法：粒子亮度 / 尺寸携带采样点亮度，重叠也不会糊掉结构。
     亮度再走一条 S 曲线 —— 花瓣与花瓣间隙的亮度差只有 ~1.4:1，直接线性映射会糊成一团。
     同时用 z 做明暗衰减（越靠后越暗），让球面隆起读得出体积感。 */
  float lum = mix(mix(aLum, aLumMoon, uMoonMix), 0.64, uLumMix);
  float lumB = 0.14 + 0.92 * smoothstep(0.34, 0.94, lum);
  float depthCue = mix(1.0, 0.40 + 0.70 * smoothstep(-3.2, 3.2, p.z), 1.0 - uLumMix);
  gl_PointSize = clamp(uSize * (0.62+aSeed.z*0.95) * (0.80+0.45*lum) * (0.70+0.30*moonFade)
                       * (uCamDist/dist) * (1.0+uShake*0.5), 1.0, 72.0);
  vBright = (0.55 + 0.55*aSeed.y) * lumB * depthCue * moonFade;
  vSeed = aSeed.x;
  vGhost = uGhost;
}`;

const PARTICLE_FS = `#version 300 es
precision highp float;
in float vBright, vSeed, vGhost;
uniform float uAlpha, uTime, uIntensity;
uniform vec3 uCool, uWarm;
out vec4 outColor;
void main(){
  vec2 c = gl_PointCoord - 0.5;
  float d = length(c) * 2.0;
  if (d > 1.0) discard;
  float sharp = mix(2.7, 1.45, vGhost);                       // 虚影更弥散
  float k = max(0.0, 1.0 - d);
  float core = pow(k, sharp);
  float halo = pow(k, 1.05) * mix(0.17, 0.42, vGhost);
  float flick = 0.74 + 0.26 * sin(uTime*6.3 + vSeed*97.0);
  float a = uAlpha * vBright * flick * uIntensity;
  vec3 col = mix(uCool, uWarm, clamp(core*1.15 + 0.08, 0.0, 1.0));
  float g = core + halo;
  outColor = vec4(col * g * a, g * a);
}`;

const QUAD_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aQuad;
out vec2 vUV;
void main(){ vUV = aQuad*0.5+0.5; gl_Position = vec4(aQuad, 0.0, 1.0); }`;

const LOGO_VS = `#version 300 es
precision highp float;
layout(location=0) in vec2 aQuad;
uniform mat4 uProj, uView;
uniform vec3 uCenter;
uniform vec2 uSize;
out vec2 vUV;
void main(){
  vUV = aQuad*0.5+0.5;
  vec3 p = uCenter + vec3(aQuad.x*uSize.x*0.5, aQuad.y*uSize.y*0.5, 0.0);
  gl_Position = uProj * uView * vec4(p, 1.0);
}`;

const LOGO_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform float uAlpha, uTime, uSweep;
out vec4 outColor;
void main(){
  vec4 t = texture(uTex, vUV);
  float a = t.a;
  if (a < 0.004) discard;
  vec3 base = mix(vec3(0.82,0.88,0.96), vec3(1.0), pow(a, 0.6));   // 实体白
  float x = (vUV.x*1.5 - fract(uTime*0.15)*2.4 + 0.45) / 0.11;
  float shine = exp(-x*x);
  base += vec3(0.55,0.62,0.72) * shine * uSweep;
  outColor = vec4(base * a * uAlpha, a * uAlpha);
}`;

const BRIGHT_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform float uThreshold, uGain;
out vec4 outColor;
void main(){
  vec3 c = texture(uTex, vUV).rgb;
  float l = max(max(c.r,c.g),c.b);
  float w = max(0.0, l - uThreshold) / max(1e-4, 1.0 - uThreshold);
  outColor = vec4(c * w * uGain, 1.0);
}`;

const BLUR_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uTex;
uniform vec2 uDir;
out vec4 outColor;
void main(){
  vec3 s = texture(uTex, vUV).rgb * 0.2270270270;
  s += texture(uTex, vUV + uDir*1.3846153846).rgb * 0.3162162162;
  s += texture(uTex, vUV - uDir*1.3846153846).rgb * 0.3162162162;
  s += texture(uTex, vUV + uDir*3.2307692308).rgb * 0.0702702703;
  s += texture(uTex, vUV - uDir*3.2307692308).rgb * 0.0702702703;
  outColor = vec4(s, 1.0);
}`;

const COMP_FS = `#version 300 es
precision highp float;
in vec2 vUV;
uniform sampler2D uScene, uBloom1, uBloom2, uHud;
uniform float uTime, uGlitch, uFlash, uBeam, uFade, uExposure, uResY, uAspect, uBloom, uHudAmt, uScanY, uScanAmt;
uniform float uVig, uGrainAmt, uLineAmt, uBeamMul;
out vec4 outColor;

float h11(float p){ p = fract(p*0.1031); p *= p+33.33; p *= p+p; return fract(p); }
float h21(vec2 p){ vec3 q = fract(vec3(p.xyx)*0.1031); q += dot(q, q.yzx+33.33); return fract((q.x+q.y)*q.z); }

float beams(vec2 uv){
  vec2 q = uv - vec2(0.52, 0.44);
  q.x *= uAspect;
  float a = -0.66, c = cos(a), s = sin(a);
  vec2 r = vec2(c*q.x - s*q.y, s*q.x + c*q.y);
  float f = 0.0;
  float a1 = (r.y - 0.135)/0.030; f += exp(-a1*a1) * 0.95;
  float a2 = (r.y - 0.020)/0.055; f += exp(-a2*a2) * 0.42;
  float a3 = (r.y - 0.300)/0.075; f += exp(-a3*a3) * 0.30;
  f *= 0.30 + 0.70*(1.0 - smoothstep(0.10, 1.25, length(vec2(q.x*0.42, q.y*1.15))));
  return max(0.0, f);
}

void main(){
  vec2 uv = vUV;
  float g = uGlitch;

  /* —— 像素偏移闪切：横向切片位移 + 块状错位 —— */
  if (g > 0.001){
    float band = floor(uv.y*28.0);
    float n = h11(band*7.13 + floor(uTime*24.0)*3.77);
    float sh = (n*2.0-1.0) * 0.10 * g * step(0.34, n);
    vec2 blk = floor(vec2(uv.x*uAspect, uv.y)*vec2(13.0, 11.0));
    float bn = h21(blk + floor(uTime*17.0)*2.3);
    uv.x += sh + (bn-0.5)*0.03*g;
    uv.y += (h11(blk.x+blk.y*3.1)*2.0-1.0)*0.006*g;
  }

  /* —— RGB 分离 —— */
  vec2 ca = vec2(0.0045*g, 0.0);
  vec3 col;
  col.r = texture(uScene, clamp(uv + ca, 0.0, 1.0)).r;
  col.g = texture(uScene, clamp(uv, 0.0, 1.0)).g;
  col.b = texture(uScene, clamp(uv - ca*1.7, 0.0, 1.0)).b;

  vec3 b1 = texture(uBloom1, clamp(uv, 0.0, 1.0)).rgb;
  vec3 b2 = texture(uBloom2, clamp(uv, 0.0, 1.0)).rgb;
  col += b1 * 0.85 * uBloom + b2 * 0.34 * uBloom;

  /* —— 体积光（随剧情淡出）；地面闪烁已移除 —— */
  col += vec3(0.62, 0.70, 0.82) * beams(vUV) * uBeamMul * uBeam;

  /* —— 扫描线：HUD 扫到哪，粒子就在哪被照亮（HUD 与画面真正联动） —— */
  if (uScanAmt > 0.001) {
    float sd = (vUV.y - uScanY) / 0.017;
    col += vec3(0.52, 0.70, 0.92) * exp(-sd * sd) * 0.20 * uScanAmt;
  }

  /* —— 极客 HUD / 终端层（和画面一起被泛光、闪切、RGB 分离处理） —— */
  col += texture(uHud, clamp(uv, 0.0, 1.0)).rgb * uHudAmt;

  /* —— 闪切瞬间的过曝 —— */
  col += vec3(1.0, 1.0, 1.05) * uFlash;

  /* —— 影调 —— */
  col *= uExposure;
  col = vec3(1.0) - exp(-col*1.28);                     // 柔和 HDR 压缩
  float r = length((vUV-0.5)*vec2(uAspect,1.0));
  col *= 1.0 - uVig * smoothstep(0.30, 1.32, r);         // 暗角
  col *= 1.0 - uLineAmt * step(0.5, fract(vUV.y*uResY*0.5));  // 扫描线

   环绕必须是“相机绕主体转”。 */
function lookAt(out, ex, ey, ez, cx, cy, cz) {
  let zx = ex - cx, zy = ey - cy, zz = ez - cz;
  let len = Math.hypot(zx, zy, zz) || 1;
  zx /= len; zy /= len; zz /= len;
  let xx = zz, xy = 0, xz = -zx;                       // x = up × z, up = (0,1,0)
  len = Math.hypot(xx, xy, xz) || 1;
  xx /= len; xy /= len; xz /= len;
  const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;  // y = z × x
  out[0] = xx; out[1] = yx; out[2] = zx; out[3] = 0;
  out[4] = xy; out[5] = yy; out[6] = zy; out[7] = 0;
  out[8] = xz; out[9] = yz; out[10] = zz; out[11] = 0;
  out[12] = -(xx * ex + xy * ey + xz * ez);
  out[13] = -(yx * ex + yy * ey + yz * ez);
  out[14] = -(zx * ex + zy * ey + zz * ez);
  out[15] = 1;
  return out;
}

function proceduralFlower(w, h) {

  for (const b of [{ o: -0.16, a: 0.20, s: 0.30 }, { o: 0.08, a: 0.13, s: 0.16 }, { o: 0.34, a: 0.07, s: 0.55 }]) {

    g.addColorStop(0.55, 'rgba(255,255,255,0.34)');
    g.addColorStop(1, 'rgba(255,255,255,0)');
    x.fillStyle = g;
    x.beginPath(); x.ellipse(px, py, R * 0.60, R * 0.34, a, 0, Math.PI * 2); x.fill();
  }
  const cg = x.createRadialGradient(cx, cy, 0, cx, cy, R * 0.36);
  cg.addColorStop(0, 'rgba(255,255,255,1)'); cg.addColorStop(0.5, 'rgba(255,255,255,0.55)'); cg.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = cg; x.beginPath(); x.arc(cx, cy, R * 0.36, 0, Math.PI * 2); x.fill();

  x.strokeStyle = 'rgba(255,255,255,0.50)'; x.lineWidth = Math.max(1, h * 0.013);

}

    lum[i] = l;

/* 自动构图：水平按权重质心（花头），垂直取“亮部跨度中心”并保证把花茎 / 花柄 / 发亮土壤都框进来。

      const v = Math.pow(t, 1.25);
      if (v > 0) { sx += x * v; sy += y * v; sw += v; }
      if (t > 0.72) {                 // 亮部：花头 + 土壤亮点（≈原图亮度 0.77，平滑光柱达不到）
        if (y < by0) by0 = y; if (y > by1) by1 = y;
        bwsum += v;
      }
    }

  const aspect = w / h;
  const cx = sw > 0 ? sx / sw : w / 2;
  const cy = bwsum > 0 ? (by0 + by1) / 2 : (sw > 0 ? sy / sw : h / 2);
  const spanY = bwsum > 0 ? (by1 - by0) / h : 0;

  const p = cdfObj.idx[lo];
  return [p % cdfObj.w, (p / cdfObj.w) | 0];

  total = ws.reduce((s, w) => s + w, 0) + spacing * (text.length - 1);
  x.fillStyle = '#fff';

  let cx = (W - total) / 2;
  const m = x.measureText('H');
  const y = H / 2 + (m.actualBoundingBoxAscent || size * 0.72) * 0.5;
  for (let i = 0; i < text.length; i++) {
    x.fillText(text[i], cx, y);

function hash2(x, y) {

  return s - Math.floor(s);

function buildFlower3D(N) {
  const F = F3D;
  const pos = new Float32Array(N * 3), lum = new Float32Array(N);
  const ln = Math.hypot(F.light[0], F.light[1], F.light[2]);
  const Lx = F.light[0] / ln, Ly = F.light[1] / ln, Lz = F.light[2] / ln;
  const ct = Math.cos(F.tilt), st = Math.sin(F.tilt);
  const tiltP = (x, y, z) => {
    const dy = y - F.headY;
    return [x, F.headY + dy * ct - z * st, dy * st + z * ct];
  };
  const tiltN = (x, y, z) => [x, y * ct - z * st, y * st + z * ct];
  const faceN = tiltN(0, 1, 0);
  let k = 0;
  const put = (x, y, z, l) => {
    pos[k * 3] = x; pos[k * 3 + 1] = y; pos[k * 3 + 2] = z;
    lum[k] = l < 0 ? 0 : l > 1 ? 1 : l;
    k++;
  };
  const shade = (nx, ny, nz, base) => {
    const d = Math.max(0, nx * Lx + ny * Ly + nz * Lz);
    return base * (0.30 + 0.82 * Math.pow(d, 0.72));
  };
  const norm3 = (x, y, z) => { const n = Math.hypot(x, y, z) || 1; return [x / n, y / n, z / n]; };

  // ---------- 舌状花（花瓣）：短而宽、椭圆圆钝、层层交错 ----------
  /* 单片花瓣参数曲面：u 沿长度、v 横向。物理半宽沿长度变化（根部收窄成爪 → 中段最宽 → 尖端圆钝），
     再换算成角宽，因此花瓣不会随半径变大而"张开成三角"。 */
  const petalAt = (pp, u, v) => {
    const r = pp.baseR + pp.len * u;
    const wp = u < 0.72
      ? 0.34 + 0.66 * Math.min(1, u / 0.17)
      : Math.sqrt(Math.max(0, 1 - Math.pow((u - 0.72) / 0.28, 2)));
    const halfW = pp.wid * wp;
    const ang = pp.theta + pp.bend * u * u + (v * halfW) / Math.max(0.15, r);
    const y = F.headY + pp.yOff
      + pp.riseA * u - pp.riseB * u * u                  // 纵向姿态（外层下弯 / 内层平展）
      + pp.cup * v * v * (0.35 + 0.65 * u)               // 边缘微微上卷 → 浅 U 截面
      + 0.030 * (1 - v * v) * (0.30 + 0.70 * u)          // 中脊
      + pp.roll * v * u;                                 // 自然扭转
    return tiltP(r * Math.cos(ang), y, r * Math.sin(ang));
  };
  const petalNormal = (pp, u, v) => {
    const e = 0.02;
    const p0 = petalAt(pp, u, v);
    const pu = petalAt(pp, Math.min(1, u + e), v);
    const pv = petalAt(pp, u, Math.min(1, v + e));
    const nx = (pu[1] - p0[1]) * (pv[2] - p0[2]) - (pu[2] - p0[2]) * (pv[1] - p0[1]);
    const ny = (pu[2] - p0[2]) * (pv[0] - p0[0]) - (pu[0] - p0[0]) * (pv[2] - p0[2]);
    const nz = (pu[0] - p0[0]) * (pv[1] - p0[1]) - (pu[1] - p0[1]) * (pv[0] - p0[0]);
    const n = norm3(nx, ny, nz);
    if (n[0] * faceN[0] + n[1] * faceN[1] + n[2] * faceN[2] < 0) {
      n[0] = -n[0]; n[1] = -n[1]; n[2] = -n[2];
    }
    return n;
  };
  /* 生成每片花瓣的独立参数：长度 / 宽度 / 姿态 / 弯折 / 扭转 / 高低都不同，
     但都围绕该层的均值小幅波动 —— 这就是"自然不对称与细微弯曲"。 */
  const petals = [];
  for (let li = 0; li < F.layers.length; li++) {
    const L = F.layers[li];
    for (let p = 0; p < L.n; p++) {
      const pp = {
        theta: (p / L.n) * Math.PI * 2 + L.off * (Math.PI * 2 / L.n) + (rnd() - 0.5) * 0.05,
        baseR: L.baseR * (0.96 + rnd() * 0.08),
        len: L.len * (0.88 + rnd() * 0.24),
        wid: L.wid * (0.90 + rnd() * 0.20),
        riseA: L.riseA * (0.85 + rnd() * 0.30),
        riseB: L.riseB * (0.85 + rnd() * 0.30),
        cup: L.cup * (0.80 + rnd() * 0.50),
        roll: (rnd() - 0.5) * 0.18,
        bend: (rnd() - 0.5) * 0.24,
        yOff: (rnd() - 0.5) * 0.07,
        gain: 0.84 + rnd() * 0.30,        // 每片花瓣自己的明度 → 花瓣之间看得出分界
        th: L.th,
      };
      pp.area = pp.len * pp.wid;
      petals.push(pp);
    }
  }
  const petalTotal = Math.round(N * 0.62);
  let areaSum = 0;
  for (const pp of petals) areaSum += pp.area;
  for (const pp of petals) {
    const cnt = Math.max(2, Math.round(petalTotal * pp.area / areaSum));
    for (let j = 0; j < cnt; j++) {
      const u = Math.pow(rnd(), 0.72), v = rnd() * 2 - 1;
      const nrm = petalNormal(pp, u, v);
      const pt = petalAt(pp, u, v);
      const th = pp.th * (rnd() - 0.5);              // 厚度内填充 → 每片花瓣是实体体积
      const ao = 0.62 + 0.38 * Math.min(1, u * 1.5);
      put(pt[0] + nrm[0] * th, pt[1] + nrm[1] * th, pt[2] + nrm[2] * th,
          shade(nrm[0], nrm[1], nrm[2], ao * pp.gain * (0.86 + 0.14 * rnd())));
    }
  }
  // ---------- 中心花心：紧凑、致密、略带起伏的球冠 ----------
  const discCount = Math.round(N * 0.14);
  for (let j = 0; j < discCount; j++) {
    const a = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * F.discR;
    const q = Math.max(0, 1 - (rr / F.discR) * (rr / F.discR));
    const h = Math.sqrt(q) * F.discBump * (0.82 + 0.36 * fbm(rr * 2.6, a * 2.2));
    const nrm = norm3(Math.cos(a) * (rr / F.discR) * 0.5, 1, Math.sin(a) * (rr / F.discR) * 0.5);
    const sparkle = rnd() < 0.42 ? 0.80 + 0.20 * rnd() : 0.56 + 0.28 * rnd();
    const pt = tiltP(rr * Math.cos(a), F.headY + h, rr * Math.sin(a));
    const nn = tiltN(nrm[0], nrm[1], nrm[2]);
    put(pt[0], pt[1], pt[2], shade(nn[0], nn[1], nn[2], sparkle));
  }
  // ---------- 花托：沿花盘轴向收缩，把花头与花茎接起来 ----------
  const recCount = Math.round(N * 0.02);
  for (let j = 0; j < recCount; j++) {
    const t = Math.pow(rnd(), 0.8);
    const rr = lerp(F.discR * 0.80, 0.13, t);
    const a = rnd() * Math.PI * 2;
    const back = 0.10 + 0.70 * t;                      // 沿 -faceN 方向后退
    const px = rr * Math.cos(a), pz = rr * Math.sin(a);
    // 在垂直于 faceN 的平面内取圆
    const up = Math.abs(faceN[1]) > 0.9 ? [1, 0, 0] : [0, 1, 0];
    const e1 = norm3(up[1] * faceN[2] - up[2] * faceN[1], up[2] * faceN[0] - up[0] * faceN[2], up[0] * faceN[1] - up[1] * faceN[0]);
    const e2 = [faceN[1] * e1[2] - faceN[2] * e1[1], faceN[2] * e1[0] - faceN[0] * e1[2], faceN[0] * e1[1] - faceN[1] * e1[0]];
    const cx = e1[0] * px + e2[0] * pz, cy = e1[1] * px + e2[1] * pz, cz = e1[2] * px + e2[2] * pz;
    const bx = -faceN[0] * back, by = -faceN[1] * back, bz = -faceN[2] * back;
    const nrm = norm3(cx * 0.9 - faceN[0] * 0.5, cy * 0.9 - faceN[1] * 0.5, cz * 0.9 - faceN[2] * 0.5);
    put(F.headY * 0 + bx + cx, F.headY + by + cy, bz + cz,
        shade(nrm[0], nrm[1], nrm[2], 0.52 + 0.26 * rnd()));
  }
  // ---------- 花茎（锥形圆管 + 轻微 S 弯），从花托末端连到地面 ----------
  const stemCount = Math.round(N * 0.045);
  const sTopY = F.headY - faceN[1] * 0.80, sTopZ = -faceN[2] * 0.80;
  for (let j = 0; j < stemCount; j++) {
    const t = rnd();
    const y = lerp(sTopY, F.stemBot, t);
    const cx = 0.42 * Math.sin(t * 1.9) - 0.18 * t;
    const cz = sTopZ * (1 - t) + 0.30 * Math.sin(t * 2.4 + 0.6) * t;
    const rad = lerp(0.105, 0.042, t);
    const a = rnd() * Math.PI * 2, rr = rad * (0.82 + 0.36 * rnd());
    const nrm = norm3(Math.cos(a), 0.12, Math.sin(a));
    put(cx + rr * Math.cos(a), y, cz + rr * Math.sin(a), shade(nrm[0], nrm[1], nrm[2], 0.80 + 0.20 * rnd()));
  }
  // ---------- 花柄上的小苞叶 ----------
  const bractCount = Math.round(N * 0.012);
  {
    const lu = norm3(0.62, 0.58, 0.30);
    const lv = norm3(-lu[2], 0, lu[0]);
    const lnr = [lu[1] * lv[2] - lu[2] * lv[1], lu[2] * lv[0] - lu[0] * lv[2], lu[0] * lv[1] - lu[1] * lv[0]];
    const bx = 0.12, by = F.headY - 1.35, bz = 0.12;
    for (let j = 0; j < bractCount; j++) {
      const u = rnd(), v = rnd() * 2 - 1;
      const halfW = 0.20 * Math.sin(Math.PI * Math.pow(u, 0.6));
      const droop = -0.20 * u * u;
      const off = (rnd() - 0.5) * 0.02;
      put(bx + lu[0] * 1.05 * u + lv[0] * halfW * v + lnr[0] * (droop + off),
          by + lu[1] * 1.05 * u + lv[1] * halfW * v + lnr[1] * (droop + off),
          bz + lu[2] * 1.05 * u + lv[2] * halfW * v + lnr[2] * (droop + off),
          shade(lnr[0], lnr[1], lnr[2], 0.72 + 0.24 * rnd()));
    }
  }
  // ---------- 地面：崎岖不平、形状不规则的亮点土壤 ----------
  let guard = 0;
  while (k < N && guard++ < N * 80) {
    const sx = (rnd() * 2 - 1) * 10.4;
    const sz = (rnd() * 2 - 1) * 3.0;
    const rn = Math.abs(sx) / 10.4;
    // 不规则轮廓：噪声决定这一处"有没有土"，边缘坑坑洼洼
    const edge = 1 - smoothstep(0.50, 1.0, rn + (fbm(sx * 0.34 + 5.2, sz * 0.75 - 2.1) - 0.5) * 0.55);
    if (rnd() > edge) continue;
    const fall = 1 - smoothstep(0.35, 1.0, rn);
    if (rnd() > 0.20 + 0.80 * fall) continue;
    // 三层噪声叠加 → 崎岖地形（有坡有谷、有碎石堆）
    const h = (fbm(sx * 0.42, sz * 1.15) - 0.5) * 1.00
            + (fbm(sx * 1.30 + 3.7, sz * 2.60) - 0.5) * 0.36
            + (fbm(sx * 3.10, sz * 5.20 + 1.3) - 0.5) * 0.14;
    const y = F.soilY + h - 0.10 * rn;
    const peak = Math.min(1, Math.max(0, h) * 1.5);          // 高处受光更亮
    const bright = (rnd() < 0.26 ? 0.62 + 0.38 * rnd() : 0.16 + 0.34 * rnd())
                 * (0.72 + 0.55 * peak) * (0.55 + 0.45 * fall);
    put(sx, y, sz, bright * (0.86 + 0.14 * rnd()));
  }
  while (k < N) put((rnd() * 2 - 1) * 10, F.soilY - 0.25, (rnd() * 2 - 1) * 3, 0.14 + 0.18 * rnd());
  return { pos, lum };
}

/* =====================================================================================
   3D 粒子月球
   整颗球体**只由悬浮的自发光粒子构成**（底下没有任何实体表面）：
   表面按撞击坑 / 月海 / 山脉做径向位移，密度与亮度随之变化
   （坑底深阴影、环脊隆起更亮、月海低洼更平更暗），
   再叠一层**视角衰减**（在着色器里按法线朝向算），于是正对相机的一面密实清晰、
   越靠边缘越稀薄消散；另有一小撮月尘粒子飘在表面之上缓慢游走。
   ===================================================================================== */
const MOON = {
  center: [0, -1.15, 0],
  R: 2.20,            // 半径：在画面里约占高度 40%（机距 ~16 时可视高度 ≈11）
  craters: 74,        // 撞击坑数量
  dustFrac: 0.0025,   // 月尘比例（极克制：只有轮廓附近极少粒子离开表面）
  light: [-0.42, 0.78, 0.46],
};

/* 配置文件覆盖月球的参数（moon.*） */
{
  MOON.center[1] = uNum(UM.centerY, MOON.center[1]);
  MOON.R = uNum(UM.radius, MOON.R);
  MOON.craters = Math.max(0, Math.round(uNum(UM.craters, MOON.craters)));
  MOON.dustFrac = Math.max(0, uNum(UM.dust, MOON.dustFrac));
  MOON.light = uVec(UM.light, MOON.light);
}

function buildMoon3D(N) {
  const C = MOON.center, R = MOON.R;
  const pos = new Float32Array(N * 3), lum = new Float32Array(N), dust = new Float32Array(N);
  const ln = Math.hypot(MOON.light[0], MOON.light[1], MOON.light[2]);
  const Lx = MOON.light[0] / ln, Ly = MOON.light[1] / ln, Lz = MOON.light[2] / ln;

  // ---- 撞击坑：方向 + 半径（幂律分布：小坑多、大坑少）+ 深度 + 环脊 ----
  const craters = [];
  for (let i = 0; i < MOON.craters; i++) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(Math.max(0, 1 - u * u));
    const rc = 0.10 + Math.pow(rnd(), 2.0) * 0.60;
    craters.push({
      dir: [s * Math.cos(th), u, s * Math.sin(th)],
      rc,
      depth: R * (0.010 + 0.032 * rnd()) * (0.45 + rc),
      rim: R * (0.006 + 0.010 * rnd()),
    });
  }
  const dustN = Math.max(4, Math.round(N * MOON.dustFrac));
  const dustStart = N - dustN;

  let k = 0, guard = 0;
  while (k < N && guard++ < N * 40) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(Math.max(0, 1 - u * u));
    const nx = s * Math.cos(th), ny = u, nz = s * Math.sin(th);

    // 大尺度地形：高地 / 盆地 / 山脊
    let h = (fbm(nx * 1.7 + 7.3, nz * 1.7 - 2.1) - 0.5) * R * 0.075
          + (fbm(ny * 3.1 - 4.4, nx * 3.1 + 1.9) - 0.5) * R * 0.030;
    // 月海：低洼、更平、更暗、也更稀
    const isMaria = fbm(nx * 1.15 + 21.7, nz * 1.15 - 9.3) > 0.62;
    let dens = 1;
    if (isMaria) { h *= 0.30; dens = 0.74; }

    // 撞击坑：碗状凹陷 + 环脊隆起；坑底密度更低（深阴影）
    let craterDark = 1, rimBright = 1;
    for (let c = 0; c < craters.length; c++) {
      const cr = craters[c];
      const dx = nx - cr.dir[0], dy = ny - cr.dir[1], dz = nz - cr.dir[2];
      const d = Math.sqrt(dx * dx + dy * dy + dz * dz);
      if (d > cr.rc * 2.4) continue;
      const q = d / cr.rc;
      if (q < 1) {
        h -= cr.depth * (1 - q * q);
        craterDark = Math.min(craterDark, 0.30 + 0.70 * q * q);
        dens = Math.min(dens, 0.50 + 0.50 * q * q);
      }
      const rw = Math.exp(-Math.pow((q - 1.06) / 0.34, 2));
      h += cr.rim * rw;
      rimBright = Math.max(rimBright, 1 + 0.70 * rw);
    }
    if (rnd() > dens) continue;                 // 密度随地形变化

    // 薄壳：粒子严格贴在三维表面上（只有极小的厚度抖动）
    const rr = R + h + (rnd() - 0.5) * 0.035;
    let px = C[0] + nx * rr, py = C[1] + ny * rr, pz = C[2] + nz * rr;

    const isDust = k >= dustStart;
    if (isDust) {                               // 极少量月尘，只轻轻离开表面
      const dd = R * (0.015 + 0.045 * rnd());
      px += nx * dd; py += ny * dd; pz += nz * dd;
    }
    dust[k] = isDust ? 1 : 0;

    /* 明暗：0.60 的环境光底 —— 背光面依然清楚可见（形状准确度优先），
       方向光只提供很克制的明暗过渡。 */
    const dl = Math.max(0, nx * Lx + ny * Ly + nz * Lz);
    let b = (0.60 + 0.48 * Math.pow(dl, 0.80)) * craterDark * rimBright;
    if (isMaria) b *= 0.86;
    b *= 0.90 + 0.20 * rnd();
    if (isDust) b *= 0.55;
    pos[k * 3] = px; pos[k * 3 + 1] = py; pos[k * 3 + 2] = pz;
    lum[k] = b < 0 ? 0 : b > 1 ? 1 : b;
    k++;
  }
  // 兜底：万一拒绝采样没填满（正常不会发生）
  while (k < N) {
    const u = rnd() * 2 - 1, th = rnd() * Math.PI * 2, s = Math.sqrt(Math.max(0, 1 - u * u));
    pos[k * 3] = C[0] + s * Math.cos(th) * R;
    pos[k * 3 + 1] = C[1] + u * R;
    pos[k * 3 + 2] = C[2] + s * Math.sin(th) * R;
    lum[k] = 0.8; dust[k] = 0; k++;
  }
  return { pos, lum, dust };
}

/* ---------------------------------- 构建 30000 颗粒子 ---------------------------------- */
let PARTICLE_COUNT = CFG.COUNT;
const attrs = {
  aScatter: null, aShape: null, aText: null, aDir: null, aSeed: null, aLum: null,
  aMoon: null, aLumMoon: null, aDust: null,
};
let textRect = { w: CFG.TEXT_PLANE_W, h: CFG.TEXT_PLANE_W * 0.4 };
let textTex = null;
let usedFallback = false;

function buildParticleBuffers(shapePoints, textPoints, lums, moon, textCanvas) {
  const N = PARTICLE_COUNT;
  const sky = new Float32Array(N * 3), flw = new Float32Array(N * 3), txt = new Float32Array(N * 3);
  const dir = new Float32Array(N * 3), sed = new Float32Array(N * 4);

  // 花形：直接就是世界坐标（照片模式在 buildAll 里已换算）
  for (let i = 0; i < N; i++) {
    const sp = shapePoints[i], tp = textPoints[i];
    const fx = sp[0], fy = sp[1], fz = sp[2];
    flw[i * 3] = fx; flw[i * 3 + 1] = fy; flw[i * 3 + 2] = fz;
    txt[i * 3] = tp[0]; txt[i * 3 + 1] = tp[1]; txt[i * 3 + 2] = tp[2];

    // 散开云团（球壳 + 轻微压扁）
    let dx = rnd() * 2 - 1, dy = rnd() * 2 - 1, dz = rnd() * 2 - 1;
    const len = Math.hypot(dx, dy, dz) || 1; dx /= len; dy /= len; dz /= len;
    const rad = 5.5 + Math.pow(rnd(), 0.72) * 17.0;
    sky[i * 3] = dx * rad; sky[i * 3 + 1] = dy * rad * 0.78; sky[i * 3 + 2] = dz * rad * 0.85 - 2.0;

    // 爆散方向：由花心指向外 + 一点上抛
    const ox = fx + (rnd() - 0.5) * 0.6, oy = fy + (rnd() - 0.5) * 0.6, oz = rnd() - 0.5;
    const olen = Math.hypot(ox, oy, oz) || 1;
    dir[i * 3] = ox / olen; dir[i * 3 + 1] = oy / olen + 0.22; dir[i * 3 + 2] = oz / olen * 0.7;

    sed[i * 4] = rnd(); sed[i * 4 + 1] = rnd(); sed[i * 4 + 2] = rnd(); sed[i * 4 + 3] = rnd();
  }

  for (const k in attrs) attrs[k] = gl.createBuffer();
  const upload = (buf, arr) => {
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, arr, gl.STATIC_DRAW);
  };
  upload(attrs.aScatter, sky); upload(attrs.aShape, flw); upload(attrs.aText, txt);
  upload(attrs.aDir, dir); upload(attrs.aSeed, sed); upload(attrs.aLum, lums);
  upload(attrs.aMoon, moon.pos); upload(attrs.aLumMoon, moon.lum); upload(attrs.aDust, moon.dust);

  /* HUD 点云小图用的抽样点：直接取自真实缓冲区，所以小图里的形变与主画面完全一致 */
  {
    const NS = SUBJECT_SAMPLES.n;
    SUBJECT_SAMPLES.k0 = subsample(sky, NS, new Float32Array(NS * 2));
    SUBJECT_SAMPLES.k1 = subsample(flw, NS, new Float32Array(NS * 2));
    SUBJECT_SAMPLES.k2 = subsample(txt, NS, new Float32Array(NS * 2));
    SUBJECT_SAMPLES.k3 = subsample(moon.pos, NS, new Float32Array(NS * 2));
  }

  // 绑定到粒子 VAO（location 0..4），用 aDir/aSeed 之外的重复 location 0 槽位会冲突，
  // 因此粒子单独建 VAO（共享几何缓冲）。

  if (textTex) gl.deleteTexture(textTex);

  gl.bindTexture(gl.TEXTURE_2D, textTex);

let PARTICLE_VAO_LOCAL = null;

function buildAll(an, textCanvas) {
  const N = PARTICLE_COUNT;
  const tpx = pixelsOf(textCanvas);
  const cdfText = buildCDF(weightsFromPixels(tpx, 'alpha'), tpx.w, tpx.h);
  const TW = CFG.TEXT_PLANE_W, TH = TW * (textCanvas.height / textCanvas.width);
  const shapePoints = new Array(N), textPoints = new Array(N);
  const lums = new Float32Array(N);

  if (CFG.MODE === 'photo' && an) {
    /* ---------------- 照片模式：亮度采样 + 球面隆起 + 程序化花茎 ---------------- */
    const shapeWeights = an.weights, shapeT = an.t, shapeW = an.w, shapeH = an.h;
    const cdfShape = buildCDF(shapeWeights, shapeW, shapeH);
    const imgAspect = shapeW / shapeH;
    const PH = CFG.IMG_FILL_H, PW = PH * imgAspect;
    const domeR = Math.max(0.01, CFG.DOME_R * PW);
    const subXw = (an.cx - 0.5) * PW, subYw = (0.5 - an.cy) * PH;
    const STEM = Math.max(120, Math.round(N * CFG.STEM_FRAC));
    const stemTop = subYw - domeR * CFG.STEM_TOP;
    const stemBot = -PH * 0.5 - 0.3;

    for (let i = 0; i < N; i++) {
      let wx, wy, pz, lb;
      if (i < STEM) {
        const t = i / (STEM - 1);
        const rad = lerp(domeR * 0.030, domeR * 0.013, t);
        const ang = rnd() * Math.PI * 2, rr = Math.sqrt(rnd()) * rad;
        wx = subXw + CFG.STEM_CURVE * Math.sin(t * Math.PI * 0.85) + Math.cos(ang) * rr;
        wy = stemTop + (stemBot - stemTop) * t + (rnd() - 0.5) * rad * 1.4;
        pz = Math.sin(ang) * rr + 0.30 * Math.sin(t * Math.PI);
        lb = 0.95;
      } else {
        const [sx, sy] = sampleFrom(cdfShape, rnd);
        const px = (sx + rnd()) / shapeW, py = (sy + rnd()) / shapeH;
        const raw = shapeT[sy * shapeW + sx];
        wx = (px - 0.5) * PW; wy = (0.5 - py) * PH;
        pz = (Math.min(1, raw * 1.5) - 0.35) * CFG.RELIEF;
        const rr = Math.hypot(wx - subXw, wy - subYw) / domeR;
        if (rr < 1) pz += CFG.DOME_H * Math.sqrt(1 - rr * rr);
        lb = Math.min(1, raw + 0.30 * groundMask(py));
      }
      shapePoints[i] = [wx, wy, pz + (rnd() - 0.5) * 0.32];
      lums[i] = lb;
    }
  } else {
    /* ---------------- 3D 模式：参数化几何重建（真体积 + 方向光明暗） ---------------- */
    const f = buildFlower3D(N);
    for (let i = 0; i < N; i++) {
      shapePoints[i] = [f.pos[i * 3], f.pos[i * 3 + 1], f.pos[i * 3 + 2]];
      lums[i] = f.lum[i];
    }
  }

  /* 3D 粒子月球：花形崩解之后回吸重聚成它（花 → 月球 → 字） */
  const moon = buildMoon3D(N);

  /* 文字虚影目标（两种模式共用） */
  for (let i = 0; i < N; i++) {
    const [tx, ty] = sampleFrom(cdfText, rnd);
    const u = (tx + rnd()) / tpx.w, v = (ty + rnd()) / tpx.h;
    textPoints[i] = [(u - 0.5) * TW + (rnd() - 0.5) * 0.012, (0.5 - v) * TH + (rnd() - 0.5) * 0.012,
                     (rnd() - 0.5) * 0.26];
  }
  buildParticleBuffers(shapePoints, textPoints, lums, moon, textCanvas);
}

/* 可分离盒式模糊（权重场用） */
function boxBlur(src, w, h, r) {
  const tmp = new Float32Array(w * h), out = new Float32Array(w * h);
  const inv = 1 / (2 * r + 1);
  for (let y = 0; y < h; y++) {
    const row = y * w;
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += src[row + Math.min(w - 1, Math.max(0, i))];
    for (let x = 0; x < w; x++) {
      tmp[row + x] = acc * inv;
      acc += src[row + Math.min(w - 1, x + r + 1)] - src[row + Math.max(0, x - r)];
    }
  }
  for (let x = 0; x < w; x++) {
    let acc = 0;
    for (let i = -r; i <= r; i++) acc += tmp[Math.min(h - 1, Math.max(0, i)) * w + x];
    for (let y = 0; y < h; y++) {
      out[y * w + x] = acc * inv;
      acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x];
    }
  }
  return out;
}

/* 两遍分析：整幅定主体框 → 源图分辨率裁框再降采样 → 亮度场 + 采样权重 */
function analyzeSource(src) {
  const fr = pixelsOf(src);
  const tFr = lumaField(fr);
  const box = subjectBox(tFr, fr.w, fr.h, CFG.CROP);
  const px = pixelsOfRect(src, box, CFG.SAMPLE_W);
  const t = lumaField(px);
  const weights = new Float32Array(t.length);
  for (let i = 0; i < t.length; i++) weights[i] = Math.pow(t[i], 1.25);
  /* 局部对比度：相对“局部平均值”更亮的像素被放大 —— 花茎（细线）与土壤亮点（小颗粒）
     都是高局部对比，因此被抬起来；平滑光柱的局部平均≈自身，不受影响。
     分区加权再乘上局部对比度，于是**只抬花茎/土壤这类结构，不抬光柱**。 */
  const bl = boxBlur(weights, px.w, px.h, 10);
  for (let i = 0; i < weights.length; i++) weights[i] *= 1 + 2.2 * Math.min(2, Math.max(0, (weights[i] - bl[i]) / (bl[i] + 0.02)));
  for (let y = 0; y < px.h; y++) {
    const band = 2.0 * groundMask(y / px.h);
    if (band > 0.001) {
      const row = y * px.w;
      for (let x = 0; x < px.w; x++) {
        const rel = Math.min(2, Math.max(0, (weights[row + x] - bl[row + x]) / (bl[row + x] + 0.02)));
        weights[row + x] *= 1 + band * rel;
      }
    }
  }
  /* —— 花茎不再从原图里找（原图里它只比背景亮 2 倍，采出来必然断续发黑），
     改由 buildAll 程序化生成一根细粒子柱。这里只保留地面土壤的加权。 */
  return { weights, t, w: px.w, h: px.h, cx: box.cx, cy: box.cy };
}

/* ---------------------------------- 启动 ---------------------------------- */
async function boot() {
  const textCanvas = makeTextCanvas(CFG.TEXT);
  let an = null;

  if (CFG.MODE === 'photo') {
    try {
      const got = await acquireSource();
      an = analyzeSource(got.src);
      const bright = an.weights.reduce((s, v) => s + (v > 0.05 ? 1 : 0), 0);
      if (bright < 200) throw new Error('image too dark');
    } catch (e) {
      usedFallback = true;
      const c = proceduralFlower(CFG.SAMPLE_W, Math.round(CFG.SAMPLE_W * 0.562));
      an = analyzeSource(c);
      const box = document.getElementById('warn');
      document.getElementById('warnBody').innerHTML =
        '读取内嵌图片失败，已退回<b>程序化花朵</b>，动画流程与特效完全一致。<br>' +
        '如需指定其它图片，可用本地服务打开：<code>node serve-http.js</code> → ' +
        '<code>http://127.0.0.1:8123/inju-particles.html?mode=photo&img=your.jpg</code>';
      box.style.display = 'block';

    (halfFloatOK ? 'HDR BLOOM' : 'LDR BLOOM');

  requestAnimationFrame(frame);

/* ---------------------------------- 时间轴状态 ---------------------------------- */
function stageAt(t) {
  let acc = 0;
  for (let i = 0; i < STAGES.length; i++) {
    const dur = STAGES[i].dur;
    if (t < acc + dur || i === LAST_I) return { i, s: STAGES[i], local: clamp(t - acc, 0, dur), p: clamp((t - acc) / dur, 0, 1) };
    acc += dur;
  }
}
function stageState(i, local, p, t) {
  const s = STAGES[i];
  const st = {
    a: s.a, b: s.b, ease: s.ease,
    prog: p, stagger: s.stagger, burst: s.burst, jitter: s.jitter,
    size: s.size * 1.0,
    ghost: lerp(s.ghostFrom, s.ghostTo, smoothstep(0.15, 0.9, p)),
    alpha: lerp(s.alphaFrom, s.alphaTo, smoothstep(0.1, 0.85, p)),
    logo: lerp(s.logoFrom, s.logoTo, smoothstep(0.05, 0.6, p)),
    glitch: 0, flash: 0, beam: lerp(s.beamFrom, s.beamTo, smoothstep(0, 1, p)), fade: 1, shake: 0, sweep: 1,
    hud: s.hud,
    /* 索引对应：0=01汇聚 1=02花体 2=03崩解 3=04回吸成月球 4=05月球 5=06显影成字 6=07虚影 7=08闪切 8=09LOGO 9=10淡出 */
    lumMix: i <= 4 ? 0 : (i === 5 ? smoothstep(0.10, 0.75, p) : 1),
    /* 月球亮度混合：花形阶段 0 → 回吸途中升到 1 → 显影成字时交还给文字亮度 */
    moonMix: i < 3 ? 0 : (i === 3 ? smoothstep(0.15, 0.85, p)
            : (i === 4 ? 1 : (i === 5 ? 1 - smoothstep(0.10, 0.75, p) : 0))),
  };
  if (i === 0) st.fade = smoothstep(0.0, 0.40, p);
  if (i === LAST_I) st.fade = 1 - smoothstep(0.05, 1.0, p);
  if (i === GLITCH_I) {
    const q = Math.floor(local * 24), n = hashQ(q), n2 = hashQ(q * 3.17 + 5);
    const snap = local > 0.46;
    st.glitch = (0.55 + 0.45 * n) * (local < 0.9 ? 1 : 0.4);
    st.flash = (local > 0.40 && local < 0.58) ? 0.9 : (n2 > 0.84 ? 0.34 : 0.0);
    st.logo = snap ? (n2 > 0.22 ? 1 : 0.32) : 0;
    st.alpha = snap ? 0.16 : 1.15;
    st.ghost = 1 - 0.55 * clamp(local / 0.46, 0, 1);
    st.size = 2.05 + (local > 0.42 && local < 0.58 ? 2.6 : 0);
    st.shake = 1;
    st.beam = lerp(s.beamFrom, s.beamTo, clamp(local / 0.46, 0, 1));
  }
  if (i === 6) st.logo = 0;
  st.time = t;
  return st;
}

/* 参数平滑：阶段之间的 size / jitter / stagger / burst / alpha / ghost / beam 都是阶跃值，
   直接硬切会在阶段边界出现“突然抖一下 / 缩一下”。这里做时间常数滤波，保证整体连贯。 */
const SMOOTH_TAU = { size: 0.13, jitter: 0.13, stagger: 0.13, burst: 0.13, ghost: 0.13, alpha: 0.13, beam: 0.20, lumMix: 0.13, moonMix: 0.13, hud: 0.25 };
const smState = Object.create(null);
function smoothParams(st, dt) {
  const step = Math.min(0.05, Math.max(0, dt));
  for (const k in SMOOTH_TAU) {
    if (smState[k] === undefined) smState[k] = st[k];
    const a = 1 - Math.exp(-step / SMOOTH_TAU[k]);
    smState[k] += (st[k] - smState[k]) * a;
    st[k] = smState[k];
  }
}

function hudUpdate(dtFrame, tNow, st, stg) {

  hudRain(dtFrame);
  hudDraw(st, stg);
  gl.bindTexture(gl.TEXTURE_2D, HUD.tex);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);

let startT = performance.now();

let lastFrame = performance.now();

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 1.75);
  const w = Math.max(320, Math.round(canvas.clientWidth * dpr));
  const h = Math.max(240, Math.round(canvas.clientHeight * dpr));
  if (w === cw && h === ch) return;
  cw = w; ch = h;
  canvas.width = w; canvas.height = h;
  allocRTs(w, h);
  if (HUD.ready) hudResize();
  gl.viewport(0, 0, w, h);

const proj = new Float32Array(16), view = new Float32Array(16);

function drawLogo(st) {

  gl.uniformMatrix4fv(p._u.uProj, false, proj);

function blit(progRef, target, tex, extra) {
  gl.useProgram(progRef);
  gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.uniform1i(progRef._u.uTex, 0);
  if (extra) extra(progRef);
  gl.bindFramebuffer(gl.FRAMEBUFFER, target ? target.fbo : null);
  gl.viewport(0, 0, target ? target.w : cw, target ? target.h : ch);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

function frame(now) {

  if (playing && !scrubbing) {
    T += dt * speed;

  }
  resize();

  const stg = stageAt(T);
  const st = stageState(stg.i, stg.local, stg.p, T);

  /* 运镜：真正的 3D 环绕 —— 相机在球面上绕主体转、始终看向主体中心，

     花形阶段环绕幅度大（把球面隆起与花茎的前后关系摇出来），

  camPos[2] = camDist * Math.cos(camYaw) * cp;

  /* ---- HUD 联动：把主体真实的包围球投影成屏幕目标框（位置/尺寸都来自真实几何） ---- */

    const br = kbA.r + (kbB.r - kbA.r) * pe;
    const mm = mul(scratch, proj, view);
    const cxl = mm[0] * bcx + mm[4] * bcy + mm[8] * bcz + mm[12];
    const cyl = mm[1] * bcx + mm[5] * bcy + mm[9] * bcz + mm[13];
    const cwl = (mm[3] * bcx + mm[7] * bcy + mm[11] * bcz + mm[15]) || 1;
    const distC = Math.max(0.1, Math.hypot(bcx - camPos[0], bcy - camPos[1], bcz - camPos[2]));
    const sr = br * (ch * 0.5) / (Math.tan(CFG.FOV * Math.PI / 360) * distC);
    const kIdx = st.prog < 0.5 ? st.a : st.b;
    if (kIdx !== HUD.target.k) { HUD.target.k = kIdx; HUD.target.lockT = T; }
    HUD.target.x = (cxl / cwl * 0.5 + 0.5) * cw / dpr;
    HUD.target.y = (0.5 - cyl / cwl * 0.5) * ch / dpr;
    HUD.target.r = sr / dpr;
    HUD.kA = st.a; HUD.kB = st.b; HUD.kMix = pe;
    HUD.phase = stg.i + 1; HUD.stageP = stg.p;
    HUD.rainSpeed = stg.i === 2 ? 2.4 : (stg.i === 4 ? 0.45 : 1);   // 崩解时数字雨加速、月球时安静
  }

  // ---- pass 1: 场景（加性混合） ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, RT.scene.fbo);
  gl.viewport(0, 0, cw, ch);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.ONE, gl.ONE);
  gl.disable(gl.DEPTH_TEST);
  drawParticles(st);
  drawLogo(st);

  // ---- pass 2..6: bloom ----
  gl.disable(gl.BLEND);
  blit(P_BRIGHT, RT.b1a, RT.scene.tex, (p) => {
    gl.uniform1f(p._u.uThreshold, halfFloatOK ? CFG.BLOOM_TH : Math.max(0.15, CFG.BLOOM_TH * 0.55));
    gl.uniform1f(p._u.uGain, 1.0);
  });
  blit(P_BLUR, RT.b1b, RT.b1a.tex, (p) => gl.uniform2f(p._u.uDir, 1.35 / RT.b1a.w, 0));
  blit(P_BLUR, RT.b1a, RT.b1b.tex, (p) => gl.uniform2f(p._u.uDir, 0, 1.35 / RT.b1a.h));
  blit(P_BLUR, RT.b2a, RT.b1a.tex, (p) => gl.uniform2f(p._u.uDir, 1.5 / RT.b2a.w, 0));
  blit(P_BLUR, RT.b2b, RT.b2a.tex, (p) => gl.uniform2f(p._u.uDir, 0, 1.5 / RT.b2b.h));

  // ---- pass 7: 合成 + 像素偏移闪切 ----
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, cw, ch);
  gl.useProgram(P_COMP);
  gl.bindVertexArray(quadVAO);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, RT.scene.tex); gl.uniform1i(P_COMP._u.uScene, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, RT.b1a.tex);   gl.uniform1i(P_COMP._u.uBloom1, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, RT.b2b.tex);   gl.uniform1i(P_COMP._u.uBloom2, 2);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, HUD.tex);      gl.uniform1i(P_COMP._u.uHud, 3);
  gl.uniform1f(P_COMP._u.uTime, T);
  gl.uniform1f(P_COMP._u.uGlitch, st.glitch);
  gl.uniform1f(P_COMP._u.uFlash, st.flash);
  gl.uniform1f(P_COMP._u.uBeam, st.beam);
  gl.uniform1f(P_COMP._u.uFade, st.fade);
  gl.uniform1f(P_COMP._u.uExposure, CFG.EXPOSURE);
  gl.uniform1f(P_COMP._u.uVig, CFG.VIGNETTE);
  gl.uniform1f(P_COMP._u.uGrainAmt, CFG.GRAIN);
  gl.uniform1f(P_COMP._u.uLineAmt, CFG.SCANLINE);
  gl.uniform1f(P_COMP._u.uBeamMul, CFG.BEAM);
  gl.uniform1f(P_COMP._u.uResY, ch);
  gl.uniform1f(P_COMP._u.uAspect, cw / ch);
  gl.uniform1f(P_COMP._u.uBloom, (halfFloatOK ? 1.0 : 0.55) * CFG.BLOOM);
  gl.uniform1f(P_COMP._u.uHudAmt, CFG.TELEMETRY ? st.hud : 0.0);
  gl.uniform1f(P_COMP._u.uScanY, HUD.scanY);
  gl.uniform1f(P_COMP._u.uScanAmt, (CFG.TELEMETRY && st.hud > 0.2) ? 0.95 : 0.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  // HUD 层：约 30fps 重绘一次（数字雨 + 终端面板）
  hudT += dt;
  if (hudT >= 1 / 30) { hudUpdate(hudT, T, st, stg); hudT = 0; }

  // HUD
  if (CFG.DEBUG) {
    document.getElementById('stats').innerHTML =
      'size ' + st.size.toFixed(3) + '  jitter ' + st.jitter.toFixed(3) + '  stagger ' + st.stagger.toFixed(3) +
      '<br>alpha ' + st.alpha.toFixed(3) + '  ghost ' + st.ghost.toFixed(3) + '  beam ' + st.beam.toFixed(3) +
      '<br>cam ' + camDist.toFixed(3) + '  ry ' + ry.toFixed(5) + '  T ' + T.toFixed(3);
  }
  hudTick(st, stg);
  if (window.INJU_AUDIO) INJU_AUDIO.frame(stg, st, dt, T, playing);   // 音效：与画面时间轴同步驱动
  requestAnimationFrame(frame);
}

let hudT = 0;                 // HUD 层重绘节流（与 DOM HUD 的 hudAcc 分开）
let hudAcc = 0;
function hudTick(st, stg) {  hudAcc++;
  if (hudAcc % 6) return;
  document.getElementById('stage').textContent = stg.s.label;
  if (!scrubbing) document.getElementById('scrub').value = String(Math.round(T / TOTAL * 1000));
  document.getElementById('tc').textContent =
    T.toFixed(2).padStart(5, '0') + ' / ' + TOTAL.toFixed(2);
}

/* ---------------------------------- 控件 ---------------------------------- */
const btnPlay = document.getElementById('btnPlay');
btnPlay.onclick = () => { playing = !playing; btnPlay.textContent = playing ? '暂停' : '播放'; btnPlay.classList.toggle('on', playing); };
const scrubEl = document.getElementById('scrub');
scrubEl.addEventListener('input', () => { T = scrubEl.value / 1000 * TOTAL; });
scrubEl.addEventListener('pointerdown', () => { scrubbing = true; if (window.INJU_AUDIO) INJU_AUDIO.notifyJump('scrub'); });
window.addEventListener('pointerup', () => { if (scrubbing && window.INJU_AUDIO) INJU_AUDIO.notifyJump('scrub'); scrubbing = false; });

/* 音效开关按钮（M 键同效） */
const btnSnd = document.getElementById('btnSnd');
function syncSndBtn(v) { btnSnd.textContent = v ? '音效 开' : '音效 关'; btnSnd.classList.toggle('on', v); }
if (window.INJU_AUDIO && INJU_AUDIO.enabled) {
  btnSnd.onclick = () => { const v = INJU_AUDIO.toggle(); syncSndBtn(v); toast(v ? '音效开启' : '音效关闭'); };
  syncSndBtn(INJU_AUDIO.on);
} else btnSnd.style.display = 'none';

/* 浏览器自动播放策略：首次任意手势才创建/恢复 AudioContext */
const unlockAudio = () => { if (window.INJU_AUDIO) INJU_AUDIO.unlock(); window.removeEventListener('pointerdown', unlockAudio); window.removeEventListener('keydown', unlockAudio); };
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (k === ' ') { e.preventDefault(); btnPlay.onclick(); }
  else if (k === 'r' || k === 'R') { T = 0; if (window.INJU_AUDIO) INJU_AUDIO.notifyJump('restart'); toast('重播'); }
  else if (k === 'c' || k === 'C') startRecording();
  else if (k === 'm' || k === 'M') { if (btnSnd.onclick) { const v = INJU_AUDIO.toggle(); syncSndBtn(v); toast(v ? '音效开启' : '音效关闭'); } }
  else if (k === '[') { intensity = Math.max(0.25, intensity - 0.12); if (window.INJU_AUDIO) INJU_AUDIO.setBrightness(intensity); toast('亮度 ' + intensity.toFixed(2)); }
  else if (k === ']') { intensity = Math.min(3.5, intensity + 0.12); if (window.INJU_AUDIO) INJU_AUDIO.setBrightness(intensity); toast('亮度 ' + intensity.toFixed(2)); }
  else if (k === '-' || k === '_') { speed = Math.max(0.15, speed - 0.1); if (window.INJU_AUDIO) INJU_AUDIO.setRate(speed); toast('速度 ' + speed.toFixed(2) + 'x'); }
  else if (k === '=' || k === '+') { speed = Math.min(3, speed + 0.1); if (window.INJU_AUDIO) INJU_AUDIO.setRate(speed); toast('速度 ' + speed.toFixed(2) + 'x'); }
  else if (/^[0-9]$/.test(k)) {
    const i = k === '0' ? 9 : parseInt(k, 10) - 1;
    if (i >= 0 && i < STAGES.length) { T = STAGE_START[i] + 0.001; if (window.INJU_AUDIO) INJU_AUDIO.notifyJump('stage'); toast('跳到 ' + STAGES[i].label); }
  }
});

/* ---------------------------------- 离线渲染探针（仅逐帧出图用，不影响正常播放/交互） ---------------------------------- */
/* 暴露一个确定性的单帧驱动：window.__render = { set(t), TOTAL }。
   外部渲染器对每个目标时刻调用 set(t)，把播放头钉在 t 并渲染该帧，再抓屏。
   不修改任何动画/相机/参数逻辑——只是把时间轴 T 精确设为 t 并暂停自动推进。 */
window.__render = {
  TOTAL,
  set(t) {
    scrubbing = true;            // 阻止 frame() 里 T += dt（播放头由外部接管）
    playing = false;
    T = clamp(t, 0, TOTAL - 0.001);
    lastFrame = performance.now();
  },
};

/* ---------------------------------- 录制 ---------------------------------- */
let recorder = null, recorderPending = false, chunks = [];
function startRecording() {
  if (recorder) return;
  if (typeof MediaRecorder === 'undefined') { toast('此浏览器不支持 MediaRecorder'); return; }
  const stream = canvas.captureStream(60);
  const types = ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mimeType = types.find((t) => MediaRecorder.isTypeSupported(t));
  try {
    recorder = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 26000000 });
  } catch (err) { toast('录制初始化失败'); recorder = null; return; }
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mimeType || 'video/webm' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'inju-particles-' + Date.now() + '.webm';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    recorder = null;
    document.getElementById('btnRec').textContent = '录制 WEBM';
    document.getElementById('btnRec').classList.remove('on');
    toast('已导出 WEBM（' + (blob.size / 1048576).toFixed(1) + ' MB）', 4000);
  };
  T = 0; recorderPending = true; playing = true;
  btnPlay.textContent = '暂停'; btnPlay.classList.add('on');
  recorder.start(250);
  document.getElementById('btnRec').textContent = '录制中…';
  document.getElementById('btnRec').classList.add('on');
  toast('正在录制一整个循环（' + TOTAL.toFixed(1) + 's）');
}
function finishRecording() {
  recorderPending = false;
  if (recorder && recorder.state !== 'inactive') recorder.stop();
}
document.getElementById('btnRec').onclick = startRecording;

/* ---------------------------------- URL 静帧模式（截图 / 出图用） ---------------------------------- */
{
  const tq = parseFloat(QS.get('t'));
  if (!isNaN(tq)) {                       // ?t=9.6 → 定格在该秒数并暂停
    T = clamp(tq, 0, TOTAL - 0.001);
    playing = false;
    btnPlay.textContent = '播放'; btnPlay.classList.remove('on');
  }
  if (QS.get('hud') === '0') {            // ?hud=0 → 隐藏全部 HUD，出干净静帧
    document.querySelectorAll('.ui').forEach((el) => { el.style.display = 'none'; });
  } else if (CFG.TELEMETRY) {
    /* 画布内的终端 HUD 已经承担了信息显示，隐藏装饰性的 DOM 文本避免重叠；
       底部控制条（播放/进度/录制）保留，仍可交互。 */
    for (const id of ['title', 'stats', 'stage', 'keys']) {
      const el = document.getElementById(id);
      if (el) el.style.display = 'none';
    }
  }
}

/* ---------------------------------- go ---------------------------------- */
hudInit();
resize();
boot();

})();
</script>
