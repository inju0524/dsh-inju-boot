<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="INJU boot animation">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#04060a"/>
    </radialGradient>
    <radialGradient id="moon" cx="36%" cy="32%" r="72%">
      <stop offset="0%" stop-color="#f3f8ff"/>
      <stop offset="58%" stop-color="#b9cde8"/>
      <stop offset="100%" stop-color="#5d7c9e"/>
    </radialGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#8fb6ff"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 花冠：外圈 12 片舌状花，内圈 8 片，层层错开 -->
  <g transform="translate(32 25)">
    <g fill="url(#petal)" opacity="0.92">
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(0)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(30)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(60)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(90)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(120)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(150)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(180)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(210)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(240)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(270)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(300)"/>
      <ellipse cx="0" cy="-12.5" rx="3.1" ry="6.2" transform="rotate(330)"/>
    </g>
    <g fill="#ffe9b0" opacity="0.85">
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(15)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(60)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(105)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(150)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(195)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(240)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(285)"/>
      <ellipse cx="0" cy="-8.4" rx="2.4" ry="4.2" transform="rotate(330)"/>
    </g>
    <circle cx="0" cy="0" r="3.4" fill="#7a5a2a" opacity="0.55"/>
  </g>

  <!-- 花茎 + 地面 -->
  <path d="M32 28 C31 34 33 39 32 46" stroke="#cfe0f4" stroke-width="1.6" fill="none" opacity="0.6"/>
  <ellipse cx="32" cy="52.5" rx="15" ry="3.1" fill="#8fb6ff" opacity="0.14"/>

  <!-- 崩解/汇聚的粒子 -->
  <g fill="#dfe9f7">
    <circle cx="11" cy="15" r="1.15" opacity="0.85"/>
    <circle cx="53" cy="13" r="1" opacity="0.7"/>
    <circle cx="8" cy="34" r="0.95" opacity="0.6"/>
    <circle cx="56" cy="33" r="1.15" opacity="0.8"/>
    <circle cx="17" cy="45" r="0.9" opacity="0.55"/>
    <circle cx="47" cy="45" r="1" opacity="0.65"/>
    <circle cx="24" cy="9" r="0.9" opacity="0.6"/>
    <circle cx="41" cy="7" r="1.05" opacity="0.75"/>
  </g>
</svg>
